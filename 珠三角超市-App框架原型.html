<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>珠三角超市 · App 框架原型</title>
<style>
  :root{
    --bg:#FFFFFF;
    --grouped:#F2F2F7;
    --fill:#E5E5EA;
    --fill-2:#D1D1D6;
    --sep:#C6C6C8;
    --label:#1C1C1E;
    --label2:#3C3C43;
    --secondary:#8E8E93;
    --tertiary:#AEAEB2;
    --white:#FFFFFF;
    --black:#000000;
    --r-card:14px;
    --r-btn:12px;
    --r-sm:8px;
    --pad:16px;
    --tab-h:56px;
    --nav-h:44px;
    --status-h:44px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font);
    background:#E8E8ED;
    color:var(--label);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  button,input,select,textarea{font-family:inherit;}
  button{cursor:pointer;border:none;background:none;padding:0;color:inherit;}

  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }

  /* ========== Phone shell — iPhone 13 mini (375×812pt) ========== */
  .phone-wrap{position:relative;}
  .phone{
    /* device body ≈ screen + uniform bezel */
    width:395px;
    height:832px;
    background:#0A0A0A;
    border-radius:48px;
    padding:10px;
    box-shadow:
      0 28px 60px rgba(0,0,0,.22),
      0 0 0 1px #2C2C2E,
      inset 0 0 0 1px #3A3A3C;
    position:relative;
    display:flex;
    flex-direction:column;
  }
  /* inner screen = iPhone 13 mini logical resolution */
  .screen{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    border-radius:38px;
    overflow:hidden;
    position:relative;
    isolation:isolate;
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:126px;height:30px;background:#0A0A0A;border-radius:0 0 18px 18px;z-index:60;
  }
  .notch::after{
    content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:8px;height:8px;border-radius:50%;background:#1C1C1E;
    box-shadow:inset 0 0 0 1.5px #2A2A2C;
  }
  .status-bar{
    height:50px;flex:0 0 auto;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:end;
    padding:0 18px 8px;
    font-size:15px;font-weight:600;letter-spacing:-.2px;
    background:transparent;z-index:55;position:relative;
    color:var(--label);
  }
  .status-bar .time{
    justify-self:start;
    font-variant-numeric:tabular-nums;
    padding-bottom:1px;
    min-width:54px;
  }
  .status-bar .notch-slot{width:126px;height:30px;}
  .status-bar .icons{
    justify-self:end;
    display:flex;align-items:center;gap:5px;
    padding-bottom:2px;
  }
  .status-bar .icons svg{display:block;}
  .status-bar .battery{
    width:25px;height:12px;border:1.2px solid var(--label);border-radius:3.5px;
    position:relative;opacity:.9;
  }
  .status-bar .battery::after{
    content:"";position:absolute;right:-3.5px;top:3px;width:1.5px;height:5px;
    background:var(--label);border-radius:0 1px 1px 0;opacity:.5;
  }
  .status-bar .battery i{
    position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:calc(100% - 3px);
    background:var(--label);border-radius:1.5px;display:block;
  }

  .app{
    flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
    background:var(--grouped);overflow:hidden;
  }

  /* ========== Nav ========== */
  .nav{
    height:var(--nav-h);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    position:relative;background:rgba(249,249,249,.94);
    border-bottom:.5px solid var(--sep);
    padding:0 8px;z-index:30;
  }
  .nav .title{font-size:17px;font-weight:600;letter-spacing:-.2px;}
  .nav .back{
    position:absolute;left:4px;top:0;bottom:0;width:48px;
    display:flex;align-items:center;justify-content:center;
    color:var(--label);font-size:17px;
  }
  .nav .back svg{width:12px;height:20px;}
  .nav .right{
    position:absolute;right:12px;top:0;bottom:0;display:flex;align-items:center;gap:10px;
    font-size:16px;color:var(--label);
  }

  /* ========== Content ========== */
  .content{
    flex:1;min-height:0;width:100%;max-width:100%;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;background:var(--grouped);
    padding-bottom:20px;
    box-sizing:border-box;
  }
  .content::-webkit-scrollbar{width:0;}
  .content.plain{background:var(--bg);}
  .pad{padding:12px var(--pad) 24px;box-sizing:border-box;}

  /* ========== Tab bar ========== */
  .tabbar{
    flex:0 0 auto;height:calc(var(--tab-h) + 18px);
    background:rgba(249,249,249,.96);
    border-top:.5px solid var(--sep);
    display:flex;align-items:flex-start;padding-top:6px;
    z-index:30;
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--secondary);font-size:10px;font-weight:500;padding-top:2px;
  }
  .tabbar button.active{color:var(--black);font-weight:600;}
  .tabbar .ic{width:26px;height:26px;display:block;}
  .tabbar .badge{
    position:absolute;top:0;right:10px;min-width:16px;height:16px;
    background:var(--black);color:#fff;font-size:10px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:600;
  }
  .tab-item{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}

  /* ========== iOS primitives ========== */
  .card{
    background:var(--white);border-radius:var(--r-card);
    overflow:hidden;margin-bottom:12px;
  }
  .card.pad-card{padding:14px 16px;}
  .section-title{
    font-size:13px;font-weight:600;color:var(--secondary);
    letter-spacing:.4px;margin:16px 4px 8px;text-transform:none;
  }
  .section-title:first-child{margin-top:4px;}
  .row{
    display:flex;align-items:center;gap:12px;
    padding:13px 16px;background:var(--white);
    border-bottom:.5px solid var(--sep);min-height:52px;
    position:relative;
  }
  .row:last-child{border-bottom:none;}
  .row.tappable:active{background:var(--fill);}
  .row .grow{flex:1;min-width:0;}
  .row .t{font-size:16px;line-height:1.25;color:var(--label);font-weight:400;}
  .row .s{font-size:13px;color:var(--secondary);margin-top:3px;line-height:1.3;}
  .row .v{font-size:15px;color:var(--secondary);text-align:right;max-width:55%;}
  .chev, .row .chev{width:8px;height:14px;min-width:8px;flex:0 0 auto;opacity:.45;display:block;}
  svg.chev{width:8px;height:14px;}
  .row .icon-sq{
    width:32px;height:32px;border-radius:8px;background:var(--fill);
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    font-size:14px;font-weight:600;color:var(--label2);
  }
  .grouped{border-radius:var(--r-card);overflow:hidden;background:var(--white);}
  .grouped .row:first-child{border-radius:var(--r-card) var(--r-card) 0 0;}
  .grouped .row:last-child{border-radius:0 0 var(--r-card) var(--r-card);}

  .btn{
    display:flex;align-items:center;justify-content:center;
    height:50px;border-radius:var(--r-btn);font-size:17px;font-weight:600;
    background:var(--black);color:var(--white);width:100%;letter-spacing:.2px;
  }
  .btn:active{opacity:.85;}
  .btn.secondary{background:var(--fill);color:var(--label);}
  .btn.ghost{background:transparent;color:var(--label);border:1px solid var(--sep);height:44px;font-size:15px;}
  .btn.sm{height:36px;font-size:14px;padding:0 14px;width:auto;border-radius:10px;}
  .btn.block-danger{background:var(--white);color:#FF3B30;border:.5px solid var(--sep);}

  .pill{
    display:inline-flex;align-items:center;height:28px;padding:0 10px;
    border-radius:14px;background:var(--fill);font-size:12px;font-weight:500;color:var(--label2);
  }
  .pill.dark{background:var(--black);color:#fff;}
  .pill.outline{background:transparent;border:1px solid var(--sep);}

  .seg{
    display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px;
  }
  .seg button{
    flex:1;height:32px;border-radius:8px;font-size:13px;font-weight:500;color:var(--label2);
  }
  .seg button.active{background:var(--white);color:var(--label);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08);}

  .input{
    width:100%;height:44px;border-radius:10px;background:var(--fill);
    border:none;padding:0 14px;font-size:16px;color:var(--label);outline:none;
  }
  .input::placeholder{color:var(--tertiary);}
  textarea.input{height:88px;padding:12px 14px;resize:none;line-height:1.4;}

  .avatar{
    width:56px;height:56px;border-radius:50%;background:var(--fill-2);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:var(--label2);
    flex:0 0 auto;
  }
  .thumb{
    width:72px;height:72px;border-radius:10px;background:var(--fill);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--secondary);text-align:center;padding:4px;line-height:1.25;
    flex:0 0 auto;font-weight:500;
  }
  .thumb.lg{width:96px;height:96px;font-size:12px;}
  .thumb.sm{width:48px;height:48px;font-size:10px;border-radius:8px;}

  .banner{
    border-radius:var(--r-card);background:var(--white);padding:16px;
    display:flex;align-items:center;gap:12px;margin-bottom:12px;
    border:.5px solid var(--sep);
  }
  .banner .bt{font-size:15px;font-weight:600;}
  .banner .bs{font-size:12px;color:var(--secondary);margin-top:3px;}

  .home-hero-banner{
    position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;
    background:#1C1C1E;
    color:#fff;min-height:132px;display:block;width:100%;text-align:left;
  }
  .home-hero-banner .hb-pad{padding:18px 16px 16px;display:flex;flex-direction:column;height:100%;min-height:132px;}
  .home-hero-banner .hb-tag{
    display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;
    background:rgba(255,255,255,.18);font-size:11px;font-weight:600;letter-spacing:.4px;width:fit-content;
  }
  .home-hero-banner .hb-title{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:10px;line-height:1.3;}
  .home-hero-banner .hb-sub{font-size:12px;opacity:.78;margin-top:6px;line-height:1.45;}
  .home-hero-banner .hb-cta{
    margin-top:auto;padding-top:12px;display:flex;align-items:center;justify-content:space-between;
  }
  .home-hero-banner .hb-cta span{font-size:12px;opacity:.7;}
  .home-hero-banner .hb-btn{
    height:30px;padding:0 14px;border-radius:15px;background:#fff;color:#1C1C1E;
    font-size:13px;font-weight:600;display:inline-flex;align-items:center;
  }
  .home-hero-banner .hb-dots{position:absolute;right:14px;top:16px;display:flex;gap:5px;}
  .home-hero-banner .hb-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.35);}
  .home-hero-banner .hb-dots i.on{background:#fff;width:14px;border-radius:3px;}

  .home-search{
    display:flex;align-items:center;gap:8px;width:100%;
    height:44px;border-radius:12px;background:var(--fill);
    padding:0 14px;margin-bottom:12px;color:var(--secondary);
    font-size:15px;text-align:left;
  }
  .home-search:active{opacity:.85;}

  .nearest-store{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:var(--white);border-radius:14px;padding:14px 14px;
    margin-bottom:12px;border:.5px solid var(--sep);
    box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .nearest-store:active{background:var(--fill);}
  .nearest-store .ns-icon{
    width:40px;height:40px;border-radius:12px;background:var(--grouped);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
    color:var(--label2);flex:0 0 auto;
  }
  .nearest-store .ns-body{flex:1;min-width:0;}
  .nearest-store .ns-label{
    font-size:11px;color:var(--secondary);letter-spacing:.2px;margin-bottom:3px;
  }
  .nearest-store .ns-name{
    font-size:15px;font-weight:600;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nearest-store .ns-meta{
    font-size:11px;color:var(--secondary);margin-top:3px;
  }
  .nearest-store .ns-go{
    flex:0 0 auto;font-size:12px;font-weight:600;color:var(--label);
    background:var(--grouped);border-radius:999px;padding:7px 12px;
  }

  .shop-ctx{
    background:var(--white);border-radius:14px;padding:12px 14px;
    margin-bottom:10px;border:.5px solid var(--sep);
  }
  .shop-ctx .row-store{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    margin-bottom:10px;
  }
  .shop-ctx .row-store .pill{flex-shrink:0;}
  .shop-ctx .row-store .name{
    flex:1;min-width:0;font-size:15px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .shop-ctx .price-note{
    font-size:11px;color:var(--secondary);margin-top:8px;line-height:1.45;
  }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}

  .tile{
    background:var(--white);border-radius:12px;padding:12px 8px;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    text-align:center;
  }
  .tile:active{background:var(--fill);}
  .tile .ti{
    width:40px;height:40px;border-radius:12px;background:var(--fill);
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--label2);
  }
  .tile .tl{font-size:11px;color:var(--label);font-weight:500;line-height:1.25;}

  .prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .prod{
    background:var(--white);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .prod .ph{
    height:110px;background:var(--fill);display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--secondary);font-weight:500;text-align:center;padding:8px;
  }
  .prod .pb{padding:10px 10px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .prod .pn{font-size:13px;font-weight:500;line-height:1.3;min-height:34px;}
  .prod .pp{display:flex;align-items:baseline;justify-content:space-between;margin-top:auto;}
  .prod .price{font-size:16px;font-weight:700;letter-spacing:-.3px;}
  .prod .price small{font-size:11px;font-weight:600;}
  .prod .add{
    width:28px;height:28px;border-radius:50%;background:var(--black);color:#fff;
    font-size:18px;font-weight:400;display:flex;align-items:center;justify-content:center;line-height:1;
  }

  .task-card{
    background:var(--white);border-radius:var(--r-card);padding:14px 16px;
    display:flex;align-items:center;gap:12px;margin-bottom:10px;
  }
  .task-card .ti{
    width:44px;height:44px;border-radius:12px;background:var(--fill);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:0 0 auto;
  }
  .task-card .grow{flex:1;min-width:0;}
  .task-card .tt{font-size:16px;font-weight:600;}
  .task-card .ts{font-size:12px;color:var(--secondary);margin-top:3px;}

  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
  .stat{
    background:var(--white);border-radius:14px;padding:14px 6px 12px;text-align:center;
    border:.5px solid var(--sep);min-height:72px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .stat:active{background:var(--fill);}
  .stat .n{font-size:18px;font-weight:700;letter-spacing:-.4px;line-height:1.15;}
  .stat .l{font-size:11px;color:var(--secondary);margin-top:5px;}

  /* 我的 · 身份卡 */
  .profile-hero{
    background:var(--white);border-radius:16px;padding:16px 14px;
    border:.5px solid var(--sep);margin-bottom:12px;
  }
  .profile-hero .ph-top{display:flex;align-items:center;gap:12px;}
  .profile-hero .avatar{
    width:56px;height:56px;border-radius:50%;background:var(--fill-2);
    display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:700;color:var(--label2);flex:0 0 auto;
  }
  .profile-hero .ph-id{flex:1;min-width:0;}
  .profile-hero .ph-name{
    font-size:18px;font-weight:700;letter-spacing:-.2px;line-height:1.25;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .profile-hero .ph-phone{
    font-size:12px;color:var(--secondary);margin-top:4px;
    font-variant-numeric:tabular-nums;
  }
  .profile-hero .ph-member{
    display:inline-flex;align-items:center;height:20px;padding:0 8px;
    border-radius:10px;background:var(--grouped);color:var(--label2);
    font-size:11px;font-weight:600;
  }
  .profile-hero .ph-store{
    display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);
    background:transparent;border-left:none;border-right:none;border-bottom:none;
  }
  .profile-hero .ph-store .tag{
    flex-shrink:0;font-size:11px;font-weight:600;color:#fff;background:#1C1C1E;
    height:22px;padding:0 8px;border-radius:11px;display:inline-flex;align-items:center;
  }
  .profile-hero .ph-store .txt{
    flex:1;min-width:0;font-size:13px;color:var(--label);font-weight:500;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* 分组标题右侧操作 */
  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:16px 4px 8px;
  }
  .section-head .st{
    font-size:13px;font-weight:600;color:var(--secondary);letter-spacing:.4px;
  }
  .section-head .more{
    font-size:13px;color:var(--label);font-weight:500;
    display:inline-flex;align-items:center;gap:2px;
  }

  /* 订单四宫格 */
  .order-quad{
    background:var(--white);border-radius:14px;border:.5px solid var(--sep);
    display:grid;grid-template-columns:repeat(4,1fr);padding:14px 4px 12px;
    margin-bottom:4px;
  }
  .order-quad button{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    background:transparent;position:relative;padding:4px 2px;
  }
  .order-quad .oi{
    width:40px;height:40px;border-radius:12px;background:var(--grouped);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--label2);position:relative;
  }
  .order-quad .ob{
    font-size:11px;color:var(--label);font-weight:500;
  }
  .order-quad .cnt{
    position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;padding:0 4px;
    background:#1C1C1E;color:#fff;font-size:10px;font-weight:700;border-radius:8px;
    display:flex;align-items:center;justify-content:center;border:2px solid #fff;
  }
  .order-quad .cnt.zero{display:none;}

  /* 服务列表收紧 */
  .svc-row .icon-sq{width:30px;height:30px;border-radius:8px;font-size:12px;}

  .empty{
    text-align:center;padding:48px 24px;color:var(--secondary);font-size:14px;
  }
  .empty .ei{
    width:64px;height:64px;border-radius:50%;background:var(--fill);
    margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;
  }

  .badge-dot{
    display:inline-flex;align-items:center;height:20px;padding:0 8px;
    border-radius:10px;font-size:11px;font-weight:600;background:var(--fill);color:var(--label2);
  }
  .badge-dot.dark{background:var(--black);color:#fff;}

  .notice{
    background:var(--white);border-radius:12px;padding:12px 14px;
    font-size:13px;color:var(--label2);line-height:1.5;border:.5px solid var(--sep);
    margin-bottom:12px;
  }
  .notice strong{font-weight:600;color:var(--label);}

  .map-ph{
    height:180px;background:var(--fill);

  .content.cat-page{

</style>

/* ========== UI helpers ========== */
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 1800);
}
function openSheet(title, bodyHtml){
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheetBody').innerHTML = bodyHtml;
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetMask').classList.add('show');
}
function closeSheet(){
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('sheetMask').classList.remove('show');
}
function navBar(title, opts={}){
  const showBack = opts.back !== false && state.stack.length > 0;
  const right = opts.right || '';
  return `<div class="nav">
    ${showBack ? `<button class="back" onclick="back()" aria-label="返回">${icons.back}</button>` : ''}
    <div class="title">${title}</div>
    ${right ? `<div class="right">${right}</div>` : ''}
  </div>`;
}
function goTab(tab){ state.tab = tab; state.stack = []; render(); }
function nav(screen, payload){ state.stack.push({screen, payload}); render(); }
function back(){ state.stack.pop(); render(); }
function resetTo(tab){ state.tab = tab; state.stack = []; render(); }

function tabbarButtons(){
  const tabs = [
    ['home','首页',icons.home],
    ['plaza','应用广场',icons.grid],
    ['tasks','积分任务',icons.gift],

  ];
  return tabs.map(([k,l,ic])=>`
    <button class="${state.tab===k?'active':''}" onclick="goTab('${k}')" style="position:relative;">
      ${ic}<span>${l}</span>
      ${k==='tasks' && state.pointsToday>0 ? `<span class="badge" style="top:-2px;right:18px;">${state.pointsToday}</span>`:''}
    </button>`).join('');
}

/* ========== Ads ========== */
let adTimer=null;
function openRewardedAd(kind){
  const goal = state.adsTodayGoal;
  if(kind!=='browse' && state.adsWatched>=goal){ toast('今日广告任务已完成'); return; }
  const ov = document.getElementById('adOverlay');
  const count = document.getElementById('adCount');
  const reward = document.getElementById('adReward');
  document.getElementById('adTitle').textContent = kind==='browse'?'品牌浏览任务':'激励视频广告';
  document.getElementById('adDesc').textContent = kind==='browse'
    ? '完成浏览任务即可获得积分。'
    : '完整观看视频可获得积分奖励。';
  reward.style.display='none';
  ov.classList.add('show');
  let t = 3;
  count.textContent = `剩余 ${t} 秒`;
  clearInterval(adTimer);
  adTimer = setInterval(()=>{
    t--;
    if(t<=0){
      clearInterval(adTimer);
      count.textContent='播放完成';
      reward.style.display='flex';
      reward.textContent = `领取 +${kind==='browse'?5:10} 积分`;
      reward.dataset.kind = kind||'video';
    } else {
      count.textContent = `剩余 ${t} 秒`;
    }
  },1000);
}
function claimAdReward(){
  const kind = document.getElementById('adReward').dataset.kind||'video';
  const add = kind==='browse'?5:10;
  state.points += add;
  state.pointsToday += add;
  state.adsWatched++;
  state.history.unshift({t: kind==='browse'?'浏览广告':'激励视频', d:'+'+add, time:'刚刚', up:true});
  document.getElementById('adOverlay').classList.remove('show');
  render();
  toast(`+${add} 积分`);
}
function openBatchAds(){
  // 看 N 条广告任务：一次引导连续完成剩余条数
  const remain = Math.max(0, state.adsTodayGoal - state.adsWatched);
  if(remain<=0){ toast('今日批次任务已完成'); return; }
  openRewardedAd();
}

/* ========== Render ========== */
function render(){
  const host = document.getElementById('screenHost');
  const top = state.stack[state.stack.length-1];
  let html = '';
  if(top){
    const p = top.payload;
    switch(top.screen){
      case 'points-history': html = screenPointsHistory(); break;
      case 'notifications': html = screenNotifications(); break;
      case 'exchange': html = screenExchange(); break;
      case 'coupons': html = screenCoupons(); break;
      case 'settings': html = screenSettings(); break;
      case 'agent': html = screenAgent(); break;
      case 'jump-store': html = screenJumpStore(); break;
      case 'jump-charge': html = screenJumpCharge(); break;
      default: html = screenHome();
    }
  } else {
    switch(state.tab){
      case 'home': html = screenHome(); break;
      case 'plaza': html = screenPlaza(); break;
      case 'tasks': html = screenTasks(); break;
      case 'profile': html = screenProfile(); break;
      default: html = screenHome();
    }
  }
  host.innerHTML = html;
  const tb = document.getElementById('tabbar');
  tb.innerHTML = tabbarButtons();
  tb.style.display = top ? 'none' : 'flex';
}

render();
